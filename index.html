    <!-- Mobile Standalone & Web App Meta Tags -->

    <!-- Google Font: Inter (UI Digital Interface) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA Service Worker Registration & Early Prompt Capture -->
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        console.log('[MDC PWA] Event beforeinstallprompt berhasil ditangkap');
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });

      window.addEventListener('appinstalled', function() {
        console.log('[MDC PWA] Aplikasi berhasil terpasang ke perangkat');
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      if ('serviceWorker' in navigator) {
        var registerMdcSW = function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[MDC PWA] Service Worker aktif:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[MDC PWA] Registrasi Service Worker gagal:', err);
            });
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerMdcSW();
        } else {
          window.addEventListener('DOMContentLoaded', registerMdcSW);
        }
      }
    </script>

    <!-- ZXing Barcode Scanning Library -->
    <script src="https://unpkg.com/@zxing/library@0.23.0"></script>

    <!-- jsPDF & AutoTable for LKUAT Document Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
