<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MDC Mobile - PDI Man Dealer</title>
    <meta name="description" content="Frontend Mobile PWA Mobile Defect Care (MDC) Honda" />
    <meta property="og:title" content="MDC Mobile - PDI Man Dealer" />
    <meta property="og:description" content="Frontend Mobile PWA Mobile Defect Care (MDC) Honda" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Mobile Standalone & Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MDC Mobile" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Font: Inter (UI Digital Interface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- PWA Service Worker Registration & Early Prompt Capture -->
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        console.log('[MDC PWA] Event beforeinstallprompt berhasil ditangkap');
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });

      window.addEventListener('appinstalled', function() {
        console.log('[MDC PWA] Aplikasi berhasil terpasang ke perangkat');
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      if ('serviceWorker' in navigator) {
        var registerMdcSW = function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[MDC PWA] Service Worker aktif:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[MDC PWA] Registrasi Service Worker gagal:', err);
            });
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerMdcSW();
        } else {
          window.addEventListener('DOMContentLoaded', registerMdcSW);
        }
      }
    </script>

    <!-- ZXing Barcode Scanning Library -->
    <script src="https://unpkg.com/@zxing/library@0.23.0"></script>

    <!-- jsPDF & AutoTable for LKUAT Document Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  </head>
  <body>
    <!-- White Splash Screen (Instant 0ms Pre-mount on Mobile Devices) -->
    <div id="mdc-app-splash" style="position:fixed;inset:0;z-index:99999;background-color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',system-ui,-apple-system,sans-serif;transition:opacity 0.4s ease-out, visibility 0.4s ease-out;">
      <style>
        @keyframes mdcPulseLogo {
          0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(220,38,38,0.2)); }
          50% { transform: scale(1.06); filter: drop-shadow(0 8px 24px rgba(220,38,38,0.35)); }
        }
        @keyframes mdcSpinRing {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes mdcBeamLine {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(0%); }
          100% { transform: translateX(100%); }
        }
        .mdc-splash-fade-out {
          opacity: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
        }
      </style>
      <div style="position:relative;display:flex;align-items:center;justify-content:center;">
        <!-- Pulsing Ring Behind Logo -->
        <div style="position:absolute;width:96px;height:96px;border-radius:9999px;border:2px solid rgba(220,38,38,0.15);border-top-color:#dc2626;animation:mdcSpinRing 1.2s linear infinite;"></div>
        <!-- Logo Container -->
        <div style="width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#dc2626,#991b1b);padding:3px;box-shadow:0 10px 25px -5px rgba(220,38,38,0.3);animation:mdcPulseLogo 2s ease-in-out infinite;">
          <div style="width:100%;height:100%;border-radius:19px;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden;">
            <img src="/icon-192.png" alt="MDC Logo" style="width:48px;height:48px;object-fit:contain;" onerror="this.src='https://lh3.googleusercontent.com/d/1fGSO4NT-xEfj0W_jeRSmfQUe1RC2_yq1'" />
          </div>
        </div>
      </div>
      <div style="margin-top:24px;text-align:center;">
        <h1 style="margin:0;font-size:18px;font-weight:700;color:#0f172a;letter-spacing:-0.02em;">MDC Mobile</h1>
        <p style="margin:4px 0 0 0;font-size:11px;font-weight:500;color:#64748b;letter-spacing:0.04em;text-transform:uppercase;">Mobile Defect Care &bull; Honda</p>
      </div>
      <!-- Subtle Red Accent Beam -->
      <div style="position:relative;width:120px;height:3px;background:#f1f5f9;border-radius:9999px;margin-top:20px;overflow:hidden;">
        <div style="position:absolute;inset:0;width:50%;background:linear-gradient(90deg,transparent,#dc2626,transparent);border-radius:9999px;animation:mdcBeamLine 1.4s ease-in-out infinite;"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically fade out splash after react bundle hydrates
      window.dismissMdcSplash = function() {
        var splash = document.getElementById('mdc-app-splash');
        if (splash && !splash.classList.contains('mdc-splash-fade-out')) {
          splash.classList.add('mdc-splash-fade-out');
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 450);
        }
      };
    </script>
  </body>
</html>
